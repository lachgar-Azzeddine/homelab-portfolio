name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

env:
  IMAGE: ghcr.io/lachgar-azzeddine/portfolio

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Print the resume to PDF
        run: |
          npx playwright install --with-deps chromium
          node scripts/resume-pdf.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7

  image:
    needs: site
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: the job's GitHub OIDC token gets a short-lived Fulcio certificate
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: sigstore/cosign-installer@v4.1.3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false # SLSA provenance is attested below, as a sigstore bundle next to the signature
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign the image, keyless
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
